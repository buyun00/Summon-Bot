<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summon Bot · 欢迎</title>
<link rel="stylesheet" href="setup.css">
<script defer src="avatars.js"></script>
<script defer src="setup.js"></script>
<body>
  <header class="titlebar"><img src="icon.png" alt=""><span>Summon Bot</span></header>
  <main id="welcome" hidden>
    <div class="welcome-heading">
      <h1 id="title" tabindex="-1">选择实例</h1>
    </div>
    <div id="conversation" role="log" aria-label="设置说明"></div>
    <div id="controls"></div>
    <p id="status" role="status"></p>
  </main>
  <main id="unpacking" hidden aria-labelledby="unpacking-title">
    <div class="unpacking-heading">
      <h1 id="unpacking-title">拆开你的工作区</h1>
    </div>
    <div class="parcel">
      <div class="parcel-inside" aria-hidden="true"></div>
      <div class="parcel-bot" aria-hidden="true"></div>
      <div class="parcel-lid" aria-hidden="true"></div>
      <div class="parcel-front">
        <div class="parcel-label" aria-hidden="true">
          <span>SUMMON BOT<strong>主 Bot 在里面</strong></span>
          <svg width="31" height="27" viewBox="0 0 31 27" fill="none">
            <path d="M7 19V4M3 8l4-4 4 4m12 11V4m-4 4 4-4 4 4M3 24h24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="parcel-strip" aria-hidden="true"></div>
      </div>
    </div>
    <div class="unpacking-caption">
      <p id="unpacking-detail">开箱后选择实例和工作区。</p>
      <div id="parcel-actions" class="buttons"></div>
    </div>
  </main>
  <main id="startup" hidden aria-labelledby="startup-label">
    <svg class="startup-art" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <image id="startup-source" href="startup-art.png" width="1536" height="1024"/>
        <clipPath id="startup-wordmark"><rect x="566" y="151" width="406" height="82"/></clipPath>
        <clipPath id="startup-sparks"><path d="M511 331H615V450H511ZM925 353H1012V439H925Z"/></clipPath>
        <clipPath id="startup-cap"><path d="M585 510C593 412 669 357 768 358C867 358 942 421 952 510Z"/></clipPath>
        <mask id="startup-eye-cutouts" maskUnits="userSpaceOnUse" x="580" y="350" width="380" height="175">
          <rect x="580" y="350" width="380" height="175" fill="white"/>
          <ellipse cx="721" cy="467" rx="15.5" ry="26.5" fill="black"/>
          <ellipse cx="817" cy="467" rx="15.5" ry="26.5" fill="black"/>
        </mask>
        <linearGradient id="startup-olive" x2="1" y2="1"><stop stop-color="#999d55"/><stop offset="1" stop-color="#8d934c"/></linearGradient>
      </defs>
      <use href="#startup-source" clip-path="url(#startup-wordmark)"/>
      <use href="#startup-source" clip-path="url(#startup-sparks)"/>
      <g class="startup-bot" clip-path="url(#startup-cap)">
        <ellipse cx="768" cy="542" rx="157" ry="155" fill="url(#startup-olive)"/>
        <use href="#startup-source" mask="url(#startup-eye-cutouts)"/>
        <ellipse class="startup-eye" cx="721" cy="467" rx="12.6" ry="23.4" fill="#fffef7"/>
        <ellipse class="startup-eye" cx="817" cy="467" rx="12.6" ry="23.4" fill="#fffef7"/>
      </g>
    </svg>
    <svg class="startup-corner startup-corner-top" viewBox="0 0 208 158" aria-hidden="true"><use href="#startup-source"/></svg>
    <svg class="startup-corner startup-corner-bottom" viewBox="1280 839 256 185" aria-hidden="true"><use href="#startup-source"/></svg>
    <div class="startup-band" role="progressbar" aria-label="工作区准备进度" aria-valuemin="0" aria-valuemax="100">
      <div class="startup-track"><div class="startup-fill"></div></div>
      <svg class="startup-seal" viewBox="0 0 60 56" aria-hidden="true">
        <path d="M2 39 21 8Q30-5 39 8L58 39Q63 54 48 54H12Q-3 54 2 39Z" fill="#888d50" stroke="#fff8e5" stroke-width="1.2"/>
        <circle cx="30" cy="41" r="4.7" fill="#fffaf0"/>
      </svg>
    </div>
    <div class="startup-caption">
      <h1 id="startup-label" role="status">正在创建工作区…</h1>
      <p id="startup-detail"></p>
    </div>
  </main>
</body>
</html>
