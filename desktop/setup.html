<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summon Bot · 欢迎</title>
<link rel="stylesheet" href="setup.css">
<script defer src="avatars.js"></script>
<script defer src="setup.js"></script>
<body>
  <header class="titlebar"><img src="icon.png" alt=""><span>Summon Bot</span></header>
  <main id="welcome" hidden>
    <div class="welcome-heading">
      <span>工作区</span>
      <h1 id="title">你好，我是主 Bot。</h1>
    </div>
    <div id="conversation" role="log" aria-label="欢迎对话"></div>
    <div id="controls"></div>
    <p id="status" role="status"></p>
  </main>
  <main id="unpacking" hidden aria-labelledby="unpacking-title">
    <div class="unpacking-heading">
      <p>SUMMON BOT <span aria-hidden="true">·</span> 本机工作区</p>
      <h1 id="unpacking-title">正在准备你的工作区</h1>
    </div>
    <div class="parcel">
      <div class="parcel-inside" aria-hidden="true"></div>
      <div class="parcel-bot" aria-hidden="true"></div>
      <div class="parcel-lid" aria-hidden="true"></div>
      <div class="parcel-front">
        <div class="parcel-label" aria-hidden="true">
          <span>SUMMON BOT<strong>主 Bot 在里面</strong></span>
          <svg width="31" height="27" viewBox="0 0 31 27" fill="none">
            <path d="M7 19V4M3 8l4-4 4 4m12 11V4m-4 4 4-4 4 4M3 24h24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="parcel-strip" role="progressbar" aria-label="本机工作区准备进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="parcel-tear" aria-hidden="true"></span>
          <span class="parcel-tab" aria-hidden="true">
            <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
              <path d="m3 3 4 4-4 4m7-8 4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
      </div>
    </div>
    <div class="unpacking-caption">
      <p id="unpacking-stage" role="status"></p>
      <p id="unpacking-detail"></p>
      <div id="parcel-actions" class="buttons" hidden></div>
    </div>
  </main>
</body>
</html>
