<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f9fa">
  <meta name="color-scheme" content="light">
  <title>Summon Bot</title>
  <link rel="apple-touch-icon" sizes="180x180" type="image/png" href="/icons/apple-touch-icon.png?v=summon-paper-20261103">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png?v=summon-paper-20261103">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/group-chat.css">
  <link rel="stylesheet" href="/summon-brand.css">
  <link rel="stylesheet" href="/motion.css">
  <link rel="stylesheet" href="/clients.css">
  <link rel="stylesheet" href="/usage.css">
  <link rel="stylesheet" href="/models.css">
  <link rel="stylesheet" href="/onboarding.css">
  <link rel="stylesheet" href="/typography.css">
  <script defer src="/branding-migration.js"></script>
  <script defer src="/avatars.js"></script>
  <script defer src="/summon-brand.js"></script>
  <script defer src="/motion.js"></script>
  <script defer src="/cache.js"></script>
  <script defer src="/usage.js"></script>
  <script defer src="/model-icons.js"></script>
  <script defer src="/models.js"></script>
  <script defer src="/onboarding.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/clients.js"></script>
</head>
<body>
  <!-- MODEL_ICON_SPRITE -->
  <div class="app-shell">
    <aside id="contact-sidebar" class="contact-sidebar" aria-label="会话与 Bot"></aside>
    <div class="workspace">
      <div id="connection-banner" class="connection-banner" hidden role="status"><span class="connection-indicator" aria-hidden="true"></span><span id="connection-message"></span><button type="button" data-action="refresh">重新连接</button></div>
      <main id="main-content" class="main-content"><div class="initial-loading"><span class="loading-ring"></span><p>正在打开你的工作空间</p></div></main>
    </div>
  </div>
  <dialog id="modal" class="modal"><div id="modal-content"></div></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
