      <use href="#cut" transform="translate(3 3) scale(.94)" fill="url(#paper2)" filter="url(#depth)"/>
      <use href="#cut" transform="translate(6 6) scale(.88)" fill="url(#paper3)" filter="url(#depth)"/>
      <use href="#cut" transform="translate(9 9) scale(.82)" fill="url(#paper4)" filter="url(#depth)"/>
