<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="outer" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#bce5fb"/>
      <stop offset="1" stop-color="#8bc6e9"/>
    </linearGradient>
    <linearGradient id="paper1" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#6caed6"/>
      <stop offset="1" stop-color="#93d1ef"/>
    </linearGradient>
    <linearGradient id="paper2" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#368ab9"/>
      <stop offset="1" stop-color="#70bae1"/>
    </linearGradient>
    <linearGradient id="paper3" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#176c9a"/>
      <stop offset="1" stop-color="#4fa3d0"/>
    </linearGradient>
    <linearGradient id="paper4" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#0b466f"/>
      <stop offset="1" stop-color="#2b85b6"/>
    </linearGradient>
    <path id="cut" d="M49 5C61 2 76 7 84 17C94 28 96 39 94 51C97 63 91 76 81 84C72 94 57 95 46 94C33 97 19 90 12 80C2 68 5 55 5 44C3 31 11 19 23 14C33 9 39 8 49 5Z"/>
    <clipPath id="edge"><circle cx="50" cy="50" r="50"/></clipPath>
    <filter id="depth" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy=".9" stdDeviation=".75" flood-color="#174b6b" flood-opacity=".5"/>
    </filter>
  </defs>
  <g clip-path="url(#edge)">
