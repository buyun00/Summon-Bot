          <text x="52" y="15" class="font" font-size="12.8" font-weight="700" fill="#4B4840">前端视觉 <tspan font-weight="400" fill="#A8A193">15:21</tspan></text>
          
          <path d="M 56 24 H 585 Q 603 24 603 42 V 59 Q 603 77 585 77 H 68 Q 50 77 50 59 V 30 Q 50 24 56 24 Z" fill="#EFECE4" stroke="#E5E0D5"/>
          <text x="68" y="55" class="font" font-size="14" fill="#1F1E1B">明白！我这就把邮件卡片的亮暗两套 HTML 模板和一键安全按钮样式排出来。</text>
        </g>
      
  
