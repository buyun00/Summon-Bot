          <text x="52" y="15" class="font" font-size="12.8" font-weight="700" fill="#4B4840">主控 Bot <tspan font-weight="400" fill="#A8A193">15:20</tspan></text>
          
          <path d="M 56 24 H 656 Q 674 24 674 42 V 82 Q 674 100 656 100 H 68 Q 50 100 50 82 V 30 Q 50 24 56 24 Z" fill="#EFECE4" stroke="#E5E0D5"/>
          <text x="68" y="55" class="font" font-size="14" fill="#1F1E1B">收到，后端迁移脚本与前端登录页改造已拆成两路在后台并行开工。</text><text x="68" y="78" class="font" font-size="14" fill="#1F1E1B">后台写代码不影响我们聊天，趁现在要不要先把下一阶段「安全通知邮件」的字段定了？</text>
        </g>
      
        <g transform="translate(283, 279)">
          <path d="M 18 0 H 621 Q 639 0 639 18 V 53 Q 639 59 633 59 H 18 Q 0 59 0 41 V 18 Q 0 0 18 0 Z" fill="#E1EAE4" stroke="#D1DFD6"/>
          <text x="20" y="30" class="font" font-size="14" fill="#1E221E">行，正好不用盯着编译干等！新设备登录提醒要带上登录城市、设备型号和一键下线链接。</text>
          <text x="625" y="51" text-anchor="end" class="font" font-size="10.8" fill="#788A7D">15:21</text>
          
        </g>
      
        <g transform="translate(38, 356)">
