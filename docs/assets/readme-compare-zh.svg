<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 708" width="100%" height="100%" style="display:block">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
    </style>
    <linearGradient id="cmpBg-zh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F2EA"/>
      <stop offset="100%" stop-color="#ECE7DA"/>
    </linearGradient>
    <linearGradient id="cmpDark-zh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B24"/>
      <stop offset="100%" stop-color="#1F2533"/>
    </linearGradient>
    <filter id="cmp-shadow" x="-3%" y="-6%" width="106%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#221E17" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="1020" height="688" rx="24" fill="url(#cmpBg-zh)" stroke="#E2DDD1" stroke-width="1.5"/>

  <text x="38" y="54" class="font" font-size="22" font-weight="800" fill="#1F1E1B">为什么选 Summon Bot？</text>
  <text x="38" y="80" class="font" font-size="13.8" fill="#635C50">对比单窗口编程助手、云端单厂商 Agent 与主流多 Agent 群聊框架</text>

  
      <g transform="translate(38, 102)">
        <rect width="472" height="192" rx="18" fill="#FFFDF8" stroke="#E2DDD1" stroke-width="1.2" filter="url(#cmp-shadow)"/>
        <rect x="22" y="18" width="207" height="26" rx="13" fill="#EEF3F7"/>
        <text x="125.5" y="35.5" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#395B75">🆚 直接用 Codex / Claude Code</text>
        <text x="22" y="69" class="font" font-size="16.5" font-weight="800" fill="#1F1E1B">告别单线程终端干等</text>
        <text x="22" y="96" class="font" font-size="13.2" fill="#544E44">不是取代 Codex，而是把 Codex / Claude 作为后台 ③ 执行引擎</text><text x="22" y="117" class="font" font-size="13.2" fill="#544E44">被群主控统一调度。重活放后台多路并行跑，前台群聊照常秒回，</text><text x="22" y="138" class="font" font-size="13.2" fill="#544E44">想到细节随口补一句就能直转进正在跑的任务里。</text>
        <rect x="22" y="154" width="428" height="26" rx="8" fill="#EEF3F7"/>
        <circle cx="35" cy="167" r="3.5" fill="#325672"/>
        <text x="46" y="171" class="font" font-size="11.6" font-weight="600" fill="#325672">前台永不卡顿 · 多路重活并发 · 随口补件秒级直转</text>
      </g>
    
      <g transform="translate(530, 102)">
        <rect width="472" height="192" rx="18" fill="#FFFDF8" stroke="#E2DDD1" stroke-width="1.2" filter="url(#cmp-shadow)"/>
        <rect x="22" y="18" width="133" height="26" rx="13" fill="#F6F2E8"/>
        <text x="88.5" y="35.5" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#785620">🆚 Grokbot (xAI)</text>
        <text x="22" y="69" class="font" font-size="16.5" font-weight="800" fill="#1F1E1B">100% 本地自托管主权</text>
        <text x="22" y="96" class="font" font-size="13.2" fill="#544E44">不绑死单一厂商的高价云电脑，也不把代码和聊天交给第三方托管。</text><text x="22" y="117" class="font" font-size="13.2" fill="#544E44">完整跑在你自己的主机上，直接读写本地工作区，自由混搭本机已有</text><text x="22" y="138" class="font" font-size="13.2" fill="#544E44">Codex / Grok / Claude 登录订阅与 DeepSeek 等多模型 API。</text>
        <rect x="22" y="154" width="428" height="26" rx="8" fill="#F6F2E8"/>
        <circle cx="35" cy="167" r="3.5" fill="#785620"/>
        <text x="46" y="171" class="font" font-size="11.6" font-weight="600" fill="#785620">自有数据根 · 直接操作本机文件 · 自由混搭多厂商模型</text>
      </g>
    
      <g transform="translate(38, 314)">
        <rect width="472" height="192" rx="18" fill="#FFFDF8" stroke="#E2DDD1" stroke-width="1.2" filter="url(#cmp-shadow)"/>
        <rect x="22" y="18" width="154" height="26" rx="13" fill="#EBF4EE"/>
        <text x="99" y="35.5" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#2E633D">🆚 OpenBot / Hermes</text>
        <text x="22" y="69" class="font" font-size="16.5" font-weight="800" fill="#1F1E1B">内核级分流与全原生四端</text>
        <text x="22" y="96" class="font" font-size="13.2" fill="#544E44">不止于提示词交接或借壳 Telegram / IM 机器人。从运行时内核</text><text x="22" y="117" class="font" font-size="13.2" fill="#544E44">实现 ① 快读静默分流、EggBot 自动建制招人、CLI 升级报错</text><text x="22" y="138" class="font" font-size="13.2" fill="#544E44">群外静默自修，并配套自带快读摘要条的全自研原生四端。</text>
        <rect x="22" y="154" width="428" height="26" rx="8" fill="#EBF4EE"/>
        <circle cx="35" cy="167" r="3.5" fill="#2E633D"/>
        <text x="46" y="171" class="font" font-size="11.6" font-weight="600" fill="#2E633D">运行时静默分流 · 自动招人建制 · 工具群外自愈</text>
      </g>
    
      <g transform="translate(530, 314)">
        <rect width="472" height="192" rx="18" fill="#FFFDF8" stroke="#E2DDD1" stroke-width="1.2" filter="url(#cmp-shadow)"/>
        <rect x="22" y="18" width="143" height="26" rx="13" fill="#F4F1FA"/>
        <text x="93.5" y="35.5" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#5E4B73">🆚 DSH SuperAgent</text>
        <text x="22" y="69" class="font" font-size="16.5" font-weight="800" fill="#1F1E1B">去中心化同伴 + 代码级硬门禁</text>
        <text x="22" y="96" class="font" font-size="13.2" fill="#544E44">无单一中心主 Session 路由瓶颈，前台聊天层也不带 bash 裸奔。</text><text x="22" y="117" class="font" font-size="13.2" fill="#544E44">每位 Bot 都拥有独立跨群人格与长期记忆，后台执行器与群发言</text><text x="22" y="138" class="font" font-size="13.2" fill="#544E44">彻底隔离，平台代码强制校验目录授权与并发乐观锁。</text>
        <rect x="22" y="154" width="428" height="26" rx="8" fill="#F4F1FA"/>
        <circle cx="35" cy="167" r="3.5" fill="#5E4B73"/>
        <text x="46" y="171" class="font" font-size="11.6" font-weight="600" fill="#5E4B73">去中心同伴协作 · 前台零 bash 裸奔 · 强制权限硬门禁</text>
      </g>
    

  <g transform="translate(38, 528)" filter="url(#cmp-shadow)">
    <rect width="964" height="142" rx="18" fill="url(#cmpDark-zh)"/>
    <text x="28" y="40" class="font" font-size="16" font-weight="800" fill="#F3F4F8">📱 全原生四端实时同步（Protocol 3） · 纸片几何头像（Bloub） · 按用途精细记账</text>
    <text x="28" y="66" class="font" font-size="13" fill="#A2AAB8">所有对话、SQLite 状态库、工具回执与模型凭据均保存在你自己的正式数据根，出门拿手机随时跟进进度：</text>
    
      <rect x="28" y="88" width="218" height="34" rx="10" fill="#252C3D" stroke="#323B50"/>
      <text x="137" y="110" text-anchor="middle" class="font" font-size="12.2" font-weight="700" fill="#E8EEF5">🌐 普通网页 (Paper / Midnight)</text>
    
      <rect x="258" y="88" width="218" height="34" rx="10" fill="#252C3D" stroke="#323B50"/>
      <text x="367" y="110" text-anchor="middle" class="font" font-size="12.2" font-weight="700" fill="#E8EEF5">💻 桌面端 (Win x64 / Mac arm64)</text>
    
      <rect x="488" y="88" width="218" height="34" rx="10" fill="#252C3D" stroke="#323B50"/>
      <text x="597" y="110" text-anchor="middle" class="font" font-size="12.2" font-weight="700" fill="#5CD49B">🍎 iOS 26 (SwiftUI Liquid Glass)</text>
    
      <rect x="718" y="88" width="218" height="34" rx="10" fill="#252C3D" stroke="#323B50"/>
      <text x="827" y="110" text-anchor="middle" class="font" font-size="12.2" font-weight="700" fill="#5CD49B">🤖 Android (Jetpack Compose)</text>
    
  </g>
</svg>
