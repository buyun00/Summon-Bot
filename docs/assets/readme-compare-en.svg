<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 708" width="100%" height="100%" style="display:block">
  <defs>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
    </style>
    <linearGradient id="cmpBg-en" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F2EA"/>
      <stop offset="100%" stop-color="#ECE7DA"/>
    </linearGradient>
    <linearGradient id="cmpDark-en" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B24"/>
      <stop offset="100%" stop-color="#1F2533"/>
    </linearGradient>
    <filter id="cmp-shadow" x="-3%" y="-6%" width="106%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#221E17" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="1020" height="688" rx="24" fill="url(#cmpBg-en)" stroke="#E2DDD1" stroke-width="1.5"/>

  <text x="38" y="54" class="font" font-size="22" font-weight="800" fill="#1F1E1B">Why Summon Bot?</text>
  <text x="38" y="80" class="font" font-size="13.8" fill="#635C50">Compared to Single-Window Coding CLIs, Cloud Vendor Agents &amp; Multi-Agent Frameworks</text>

  
      <g transform="translate(38, 102)">
        <rect width="472" height="192" rx="18" fill="#FFFDF8" stroke="#E2DDD1" stroke-width="1.2" filter="url(#cmp-shadow)"/>
        <rect x="22" y="18" width="194" height="26" rx="13" fill="#EEF3F7"/>
        <text x="119" y="35.5" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#395B75">🆚 Raw Codex / Claude Code</text>
        <text x="22" y="69" class="font" font-size="16.5" font-weight="800" fill="#1F1E1B">No Single-Thread Terminal Freeze</text>
        <text x="22" y="96" class="font" font-size="13.2" fill="#544E44">Does not replace Codex—orchestrates Codex / Claude as background</text><text x="22" y="117" class="font" font-size="13.2" fill="#544E44">③ execution engines. Run multiple heavy jobs in parallel while</text><text x="22" y="138" class="font" font-size="13.2" fill="#544E44">group chat replies instantly and steers live jobs on the fly.</text>
        <rect x="22" y="154" width="428" height="26" rx="8" fill="#EEF3F7"/>
        <circle cx="35" cy="167" r="3.5" fill="#325672"/>
        <text x="46" y="171" class="font" font-size="11.3" font-weight="600" fill="#325672">Instant chat · Parallel heavy jobs · Live mid-run steer</text>
      </g>
    
      <g transform="translate(530, 102)">
        <rect width="472" height="192" rx="18" fill="#FFFDF8" stroke="#E2DDD1" stroke-width="1.2" filter="url(#cmp-shadow)"/>
        <rect x="22" y="18" width="133" height="26" rx="13" fill="#F6F2E8"/>
        <text x="88.5" y="35.5" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#785620">🆚 Grokbot (xAI)</text>
        <text x="22" y="69" class="font" font-size="16.5" font-weight="800" fill="#1F1E1B">100% Local Self-Hosted Ownership</text>
        <text x="22" y="96" class="font" font-size="13.2" fill="#544E44">No vendor cloud VM lock-in or third-party data custody. Runs right</text><text x="22" y="117" class="font" font-size="13.2" fill="#544E44">on your own machine with direct access to local workspaces, freely</text><text x="22" y="138" class="font" font-size="13.2" fill="#544E44">mixing your existing Codex, Grok, Claude &amp; DeepSeek accounts.</text>
        <rect x="22" y="154" width="428" height="26" rx="8" fill="#F6F2E8"/>
        <circle cx="35" cy="167" r="3.5" fill="#785620"/>
        <text x="46" y="171" class="font" font-size="11.3" font-weight="600" fill="#785620">Local data root · Direct host workspace · Mix any model</text>
      </g>
    
      <g transform="translate(38, 314)">
        <rect width="472" height="192" rx="18" fill="#FFFDF8" stroke="#E2DDD1" stroke-width="1.2" filter="url(#cmp-shadow)"/>
        <rect x="22" y="18" width="154" height="26" rx="13" fill="#EBF4EE"/>
        <text x="99" y="35.5" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#2E633D">🆚 OpenBot / Hermes</text>
        <text x="22" y="69" class="font" font-size="16.5" font-weight="800" fill="#1F1E1B">Kernel-Level Triage &amp; 4 Native Apps</text>
        <text x="22" y="96" class="font" font-size="13.2" fill="#544E44">Goes beyond prompt handoffs or borrowed Telegram UIs: runtime</text><text x="22" y="117" class="font" font-size="13.2" fill="#544E44">① Fast-Read silence triage, EggBot auto-spawning, out-of-band</text><text x="22" y="138" class="font" font-size="13.2" fill="#544E44">CLI self-repair, and 4 first-party apps with built-in read chips.</text>
        <rect x="22" y="154" width="428" height="26" rx="8" fill="#EBF4EE"/>
        <circle cx="35" cy="167" r="3.5" fill="#2E633D"/>
        <text x="46" y="171" class="font" font-size="11.3" font-weight="600" fill="#2E633D">Runtime triage · Auto team spawning · Silent CLI repair</text>
      </g>
    
      <g transform="translate(530, 314)">
        <rect width="472" height="192" rx="18" fill="#FFFDF8" stroke="#E2DDD1" stroke-width="1.2" filter="url(#cmp-shadow)"/>
        <rect x="22" y="18" width="143" height="26" rx="13" fill="#F4F1FA"/>
        <text x="93.5" y="35.5" text-anchor="middle" class="font" font-size="12" font-weight="700" fill="#5E4B73">🆚 DSH SuperAgent</text>
        <text x="22" y="69" class="font" font-size="16.5" font-weight="800" fill="#1F1E1B">Peer Collaboration + Code Hard Gates</text>
        <text x="22" y="96" class="font" font-size="13.2" fill="#544E44">No single central router bottleneck and no raw bash on the chat</text><text x="22" y="117" class="font" font-size="13.2" fill="#544E44">router. Every Bot keeps cross-room persona &amp; memory under strict</text><text x="22" y="138" class="font" font-size="13.2" fill="#544E44">platform-enforced directory grants and optimistic revision locks.</text>
        <rect x="22" y="154" width="428" height="26" rx="8" fill="#F4F1FA"/>
        <circle cx="35" cy="167" r="3.5" fill="#5E4B73"/>
        <text x="46" y="171" class="font" font-size="11.3" font-weight="600" fill="#5E4B73">Decentralized peers · Isolated execution · Hard gates</text>
      </g>
    

  <g transform="translate(38, 528)" filter="url(#cmp-shadow)">
    <rect width="964" height="142" rx="18" fill="url(#cmpDark-en)"/>
    <text x="28" y="40" class="font" font-size="15" font-weight="800" fill="#F3F4F8">📱 4 First-Party Clients (Protocol 3) · Vector Paper Avatars (Bloub) · Purpose Ledger</text>
    <text x="28" y="66" class="font" font-size="12.6" fill="#A2AAB8">All chats, SQLite ledgers, tool receipts &amp; credentials stay in your local data root—follow builds from your phone:</text>
    
      <rect x="28" y="88" width="218" height="34" rx="10" fill="#252C3D" stroke="#323B50"/>
      <text x="137" y="110" text-anchor="middle" class="font" font-size="11.4" font-weight="700" fill="#E8EEF5">🌐 Web (Paper / Midnight)</text>
    
      <rect x="258" y="88" width="218" height="34" rx="10" fill="#252C3D" stroke="#323B50"/>
      <text x="367" y="110" text-anchor="middle" class="font" font-size="11.4" font-weight="700" fill="#E8EEF5">💻 Desktop (Win / Mac arm64)</text>
    
      <rect x="488" y="88" width="218" height="34" rx="10" fill="#252C3D" stroke="#323B50"/>
      <text x="597" y="110" text-anchor="middle" class="font" font-size="11.4" font-weight="700" fill="#5CD49B">🍎 iOS 26 (Liquid Glass)</text>
    
      <rect x="718" y="88" width="218" height="34" rx="10" fill="#252C3D" stroke="#323B50"/>
      <text x="827" y="110" text-anchor="middle" class="font" font-size="11.4" font-weight="700" fill="#5CD49B">🤖 Android (Compose)</text>
    
  </g>
</svg>
