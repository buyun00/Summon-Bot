<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay · Little Crew 动画工作台</title>
<style>
:root{color-scheme:light;font-family:system-ui,'Microsoft YaHei',sans-serif;color:#142443;background:#faf7f0}*{box-sizing:border-box}body{margin:0}header{padding:26px 4vw;border-bottom:1px solid #e6dfd4;display:flex;justify-content:space-between;align-items:center}header strong{letter-spacing:4px;font-size:17px}header span{font-size:13px;color:#7b807f}main{max-width:1380px;margin:auto;padding:26px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px}.panel{border:1px solid #e5ded2;border-radius:22px;background:#fffdf8;padding:22px}.hero{height:325px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,#fff4e1,transparent 70%)}h1{font-size:26px;margin:0 0 6px}h2{font-size:14px;margin:22px 0 12px}.muted{color:#7b807f;font-size:13px;line-height:1.7}.sizes{display:flex;gap:25px;justify-content:center;align-items:end;padding:12px}.sizes>div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:#848483}svg{display:block;overflow:visible;flex-shrink:0}.catalog{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:18px}button,select{font:inherit;color:inherit;border:1px solid #ded9cf;background:#fffdf8;border-radius:12px;padding:10px;cursor:pointer}button:hover{border-color:#acb5c3}button.active{border-color:#142443;background:#f0ede6;box-shadow:inset 0 0 0 1px #142443}.catalog button{display:flex;flex-direction:column;align-items:center;font-size:12px;padding:6px;gap:4px}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.states button{font-size:13px}.states small{display:block;font-size:10px;opacity:.6;margin-top:4px}.row{display:flex;gap:8px}.row button{flex:1}label{display:flex;justify-content:space-between;align-items:center;margin:11px 0;font-size:13px}input[type=color]{width:42px;height:30px;padding:1px;border:1px solid #ddd;border-radius:8px;background:white}input[type=range]{width:100%;accent-color:#172846}#motionNote{min-height:48px}#timeline{height:4px;background:#e9e4dc;border-radius:4px;overflow:hidden;margin-top:15px}#progress{height:100%;background:#d5a168;transform-origin:left;transform:scaleX(0)}.strip{grid-column:1/-1}.motion-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.motion-card{display:flex;flex-direction:column;align-items:center;background:#f9f6ee;border-radius:14px;padding:12px;font-size:13px}.motion-card span{font-size:11px;color:#7b807f;line-height:1.6;text-align:center;margin-top:6px}footer{padding:15px 26px 28px;text-align:center;color:#898c8b;font-size:12px}.dark{background:#202b40!important}.dark .muted{color:#d7dce6}.dark .hero{background:none}.dark h1{color:#f8f5ed}.dark .sizes{color:#ddd}.dark .sizes>div{color:#ddd}@media(max-width:850px){main{grid-template-columns:1fr;padding:15px}.catalog{grid-template-columns:repeat(4,1fr)}.motion-grid{grid-template-columns:repeat(3,1fr)}header span{display:none}.hero{height:280px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<header><strong>RELAY / LITTLE CREW</strong><span>12 个职业伙伴 · 72 组状态动画 · 自由换色</span></header>
<main><section><div class="panel" id="stage"><h1 id="roleTitle"></h1><div class="muted" id="roleNote"></div><div class="hero" id="hero"></div><div class="sizes" id="sizes"></div></div><div class="catalog" id="catalog"></div></section>
<aside class="panel"><h2 style="margin-top:0">动作状态</h2><div class="states" id="states"></div><p class="muted" id="motionNote"></p><div id="timeline"><div id="progress"></div></div><p class="muted" id="status">动作之间柔和衔接</p><div class="row"><button id="pause">暂停</button><button id="auto">连续演示：关</button></div><h2>角色配色</h2><label>主色块<input id="accent" type="color"></label><label>辅助色块<input id="secondary" type="color"></label><label>轮廓与眼睛<input id="ink" type="color" value="#142443"></label><label>底色<input id="paper" type="color" value="#fffaf1"></label><div class="row"><button id="reset">恢复角色配色</button><button id="dark">深色底</button></div><h2>播放速度 <output id="rate">1.0×</output></h2><input id="speed" type="range" min="0.4" max="1.6" step="0.1" value="1"><h2>导出</h2><div class="row"><button id="svg">当前帧 SVG</button><button id="config">角色配置</button></div><p class="muted">SVG 导出当前静态姿态；完整动画由独立的 SVG 动画模块驱动。颜色块与轮廓同步变形。</p></aside>
<section class="panel strip"><h2 style="margin-top:0">六种动作并排看</h2><div class="motion-grid" id="motionGrid"></div><p class="muted">这里固定展示六种状态；完成动画会间隔重播。上方角色的完成动作播放一次后保持笑眼。可连续点选不同状态，观察中途切换。</p></section></main><footer>分层矢量原型 · 尚未替换正式 Bot 头像</footer><script type="module" src="./preview.js"></script></html>
