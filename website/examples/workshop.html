<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>手缝一本书 · 纸间工作坊</title>
  <style>
    body.sample-document { margin: 0; padding: 0; color-scheme: light dark; background: light-dark(#f5efe3,#2c2927); }
    .studio { --desk: light-dark(#f5efe3,#2c2927); --print: light-dark(#3d3228,#f5e9d4); --line: light-dark(#75624c68,#dfc9ab60); --thread: light-dark(#8e4939,#edac8e); background: var(--desk); color: var(--print); font: 15px/1.45 "Segoe UI","Microsoft YaHei",sans-serif; padding: clamp(12px,3vw,22px); }
    .studio * { box-sizing: border-box; }
    .studio .imprint { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .studio .imprint b { font: 700 clamp(21px,4vw,29px)/1.2 Georgia,"Songti SC",SimSun,serif; }
    .studio .imprint small { font-size: 12px; }
    .studio .book-desk { position: relative; display: grid; place-items: center; padding: 12px 0 17px; perspective: 700px; }
    .studio .book { width: min(73%,220px); height: 86px; position: relative; display: block; background: transparent; border: 0; color: #493728; cursor: pointer; font: inherit; -webkit-tap-highlight-color: transparent; }
    .studio .book-page { position: absolute; inset: 0 0 0 43%; display: grid; place-items: center; background: #f7f0dd; border: 1px solid #ad9779; box-shadow: 2px 3px #d7c8ad,3px 4px 4px #3e2e272b; font: 600 12px/1.5 Georgia,"Songti SC",SimSun,serif; }
    .studio .book-page span { max-width: 6em; }
    .studio .book-cover { position: absolute; inset: 0 0 0 43%; transform-origin: left center; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.25,.55,.2,1); }
    .studio .book-cover::before, .studio .book-cover::after { content: ""; position: absolute; inset: 0; border: 1px solid #a48760; backface-visibility: hidden; }
    .studio .book-cover::before { background: #cfb082; }
    .studio .book-cover::after { background: #f1e4c8; transform: rotateY(180deg); }
    .studio .book-cover i { position: absolute; left: -1px; z-index: 1; width: 14%; border-top: 2px solid #98503f; transform: rotate(-9deg) translateZ(1px); }
    .studio .book-cover i:nth-child(1) { top: 22%; }
    .studio .book-cover i:nth-child(2) { top: 50%; }
    .studio .book-cover i:nth-child(3) { top: 77%; }
    .studio .book-cover b { position: absolute; top: 16%; right: 13%; font: 700 12px/1.25 Georgia,"Songti SC",SimSun,serif; writing-mode: vertical-rl; background: #f4e6c8; padding: 3px 1px; transform: translateZ(1px); backface-visibility: hidden; }
    .studio .book[aria-pressed="true"] .book-cover { transform: rotateY(-165deg); }
    .studio .flip-label { color: var(--thread); font-size: 12px; }
    .studio fieldset { margin: 0; padding: 0; border: 0; min-width: 0; }
    .studio legend { color: var(--print); font-size: 13px; font-weight: 650; margin-bottom: 4px; }
    .studio .session { display: flex; align-items: center; gap: 6px; padding: 8px 2px; border-top: 1px solid var(--line); cursor: pointer; }
    .studio .session input { accent-color: var(--thread); margin: 0 3px 0 0; }
    .studio .session small { margin-left: auto; font-size: 12px; }
    .studio .draft { margin-block: 3px; padding: 7px 12px; background: var(--print); color: var(--desk); border: 0; border-radius: 3px; font: inherit; cursor: pointer; }
    .studio .ticket { display: block; color: var(--thread); margin-top: 5px; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
    .studio .ticket:empty { display: none; }
    .studio :focus-visible { outline: 2px solid var(--thread); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .studio .book-cover { transition: none; } }
  </style>
</head>
<body class="sample-document">
  <main class="studio" aria-label="纸间工作坊课程页">
    <div class="imprint"><b>手缝一本书</b><small>纸间工作坊 · 90 分钟</small></div>
    <div class="book-desk">
      <button type="button" class="book" aria-pressed="false" aria-label="翻开样书">
        <span class="book-page"><span>这本书是你亲手缝的</span></span>
        <span class="book-cover" aria-hidden="true"><i></i><i></i><i></i><b>手缝一本书</b></span>
      </button>
      <span class="flip-label" aria-hidden="true">点封面翻书</span>
    </div>
    <fieldset>
      <legend>周六场次</legend>
      <label class="session"><input type="radio" name="workshop-session" value="morning" checked>10:00 <small>余 1 席</small></label>
      <label class="session"><input type="radio" name="workshop-session" value="afternoon">14:00 <small>已满 · 可候补</small></label>
    </fieldset>
    <button class="draft" type="button">生成报名草稿</button>
    <output class="ticket" aria-live="polite"></output>
  </main>
  <script>
    (() => {
      const studio = document.querySelector('.studio');
      const book = studio.querySelector('.book');
      const ticket = studio.querySelector('.ticket');
      const draft = studio.querySelector('.draft');
      const morning = () => studio.querySelector('input:checked').value === 'morning';
      book.addEventListener('click', () => {
        const opened = book.getAttribute('aria-pressed') === 'false';
        book.setAttribute('aria-pressed', String(opened));
        book.setAttribute('aria-label', opened ? '合上样书，内页写着「这本书是你亲手缝的」' : '翻开样书');
        studio.querySelector('.flip-label').textContent = opened ? '点内页合上' : '点封面翻书';
      });
      studio.addEventListener('change', () => {
        ticket.textContent = '';
        draft.textContent = morning() ? '生成报名草稿' : '生成候补草稿';
      });
      draft.addEventListener('click', () => {
        ticket.textContent = '纸间工作坊 ／ 手缝一本书 ／ ' + (morning() ? '10:00 · 报名一人' : '14:00 · 候补一人') + '（草稿）';
      });
      if (document.body.classList.contains('sample-document') && parent !== window && 'ResizeObserver' in window) {
        new ResizeObserver(() => parent.postMessage({ summonSampleHeight: studio.offsetHeight }, '*')).observe(studio);
      }
    })();
  </script>
</body>
</html>
