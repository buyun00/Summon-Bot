name: Installed PC backend Web acceptance round 2
on:
  workflow_dispatch:
    inputs:
      followup:
        type: boolean
        default: false
        description: Resolve raw Host transport and installed CLI process timing only
      diagnostics:
        type: boolean
        default: false
        description: Inspect installed dependencies and remaining CLI entries without rerunning functional cases
permissions:
  contents: read
  actions: read
concurrency:
  group: web-acceptance-round2
  cancel-in-progress: false
jobs:
  web:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: Download exact candidate EXE and install silently
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $acceptanceRoot = Join-Path $env:RUNNER_TEMP 'summon-acceptance'
          $installRoot = Join-Path $acceptanceRoot 'installed'
          New-Item -ItemType Directory -Path (Join-Path $acceptanceRoot 'evidence') -Force | Out-Null
          gh run download 42196380346 --repo buyun00/Summon-Bot --name summon-candidate-windows-x64 --dir (Join-Path $acceptanceRoot 'candidate')
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          $installer = Get-ChildItem -LiteralPath (Join-Path $acceptanceRoot 'candidate') -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Candidate EXE missing' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $installRoot 'summon.cmd'))) { throw 'Installed CLI missing' }
          $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          & $openssl req -x509 -newkey rsa:2048 -nodes -keyout (Join-Path $acceptanceRoot 'tls.key') -out (Join-Path $acceptanceRoot 'tls.crt') -days 1 -subj '/CN=acceptance-cloud.test' -addext 'subjectAltName=DNS:acceptance-cloud.test,DNS:acceptance-node.acceptance.ts.net' 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'TLS fixture creation failed' }
          Add-Content -LiteralPath "$env:SystemRoot\System32\drivers\etc\hosts" -Value '127.0.0.1 acceptance-cloud.test acceptance-node.acceptance.ts.net'
          @{ installer = $installer.Name; exitCode = $process.ExitCode; cliPresent = $true; sourceRun = 42196380346; scope = 'Installed PC backend; Web-only feature acceptance' } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $acceptanceRoot 'evidence\installation.json')
      - name: Drive installed backend through Web HTTP SSE and actual Pi
        if: ${{ !inputs.diagnostics && !inputs.followup }}
        shell: pwsh
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}\summon-acceptance\tls.crt
          ACCEPTANCE_ROOT: ${{ runner.temp }}\summon-acceptance
          SUMMON_INSTALL_ROOT: ${{ runner.temp }}\summon-acceptance\installed
        run: |
          & "$env:SUMMON_INSTALL_ROOT\resources\summon-runtime\runtime\node.exe" harness/scripts/acceptance/desktop-web-round2.mjs
          exit $LASTEXITCODE
      - name: Resolve Host transport and installed CLI timing
        if: ${{ inputs.followup }}
        shell: pwsh
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}\summon-acceptance
          SUMMON_INSTALL_ROOT: ${{ runner.temp }}\summon-acceptance\installed
        run: |
          & "$env:SUMMON_INSTALL_ROOT\resources\summon-runtime\runtime\node.exe" harness/scripts/acceptance/desktop-web-round2-followup.mjs
          exit $LASTEXITCODE
      - name: Inspect installed resource paths and remaining CLI entries
        if: ${{ inputs.diagnostics }}
        shell: pwsh
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}\summon-acceptance
          SUMMON_INSTALL_ROOT: ${{ runner.temp }}\summon-acceptance\installed
        run: |
          & "$env:SUMMON_INSTALL_ROOT\resources\summon-runtime\runtime\node.exe" harness/scripts/acceptance/package-diagnostics.mjs
          exit $LASTEXITCODE
      - name: Collect result and reproduction evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summon-web-acceptance-round2
          path: ${{ runner.temp }}/summon-acceptance/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove temporary installed package
        if: always()
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'summon-acceptance\installed'
          $uninstaller = Join-Path $installRoot 'Uninstall Summon Bot.exe'
          if (Test-Path -LiteralPath $uninstaller) {
            $p = Start-Process -FilePath $uninstaller -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
            Write-Output "Uninstaller exit: $($p.ExitCode)"
          }

