name: Client releases

on:
  push:
    branches: [main]
    paths:
      - release.json
      - desktop/**
      - android/**
      - scripts/release/**
      - .github/workflows/client-releases.yml
  workflow_dispatch:
    inputs:
      platform:
        description: Client to build (Windows normally builds locally)
        type: choice
        default: cloud
        options: [cloud, macos, android, windows]

permissions:
  contents: write

concurrency:
  group: client-releases
  cancel-in-progress: false

jobs:
  macos:
    if: github.event_name == 'push' || inputs.platform == 'cloud' || inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix desktop --no-audit --no-fund
      - name: Build and publish unsigned universal DMG and ZIP
        run: npm run release:desktop -- --github
        env:
          GH_TOKEN: ${{ github.token }}

  android:
    if: github.event_name == 'push' || inputs.platform == 'cloud' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare existing Android signing identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SUMMON_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::Configure SUMMON_ANDROID_KEYSTORE_BASE64 and the existing Android signing credentials.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/summon-android.p12"
      - name: Build and publish signed APK
        run: npm run release:android -- --github
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMON_ANDROID_KEYSTORE: ${{ runner.temp }}/summon-android.p12
          SUMMON_ANDROID_KEY_ALIAS: ${{ secrets.SUMMON_ANDROID_KEY_ALIAS }}
          SUMMON_ANDROID_STORE_PASSWORD: ${{ secrets.SUMMON_ANDROID_STORE_PASSWORD }}
          SUMMON_ANDROID_KEY_PASSWORD: ${{ secrets.SUMMON_ANDROID_KEY_PASSWORD }}

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix desktop --no-audit --no-fund
      - name: Build and publish Windows x64
        run: npm run release:desktop -- --arch x64 --github
        env:
          GH_TOKEN: ${{ github.token }}
