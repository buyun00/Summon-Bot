name: Client releases

on:
  push:
    branches: [main]
    paths:
      - release.json
  workflow_dispatch:
    inputs:
      platform:
        description: Client to build and publish on GitHub Actions
        type: choice
        default: cloud
        options: [cloud, macos, android, windows]
      candidate:
        description: Build candidate artifacts without publishing
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: client-releases
  cancel-in-progress: false

jobs:
  macos:
    if: github.event_name == 'push' || inputs.platform == 'cloud' || inputs.platform == 'macos'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix desktop --no-audit --no-fund
      - run: npm ci --omit=dev --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: summon-client-deps-v1-macos-arm64-electron-45.2.1-builder-26.18.1
      - name: Prepare official desktop dependencies through GitHub asset API
        run: node scripts/release/prepare-ci-dependencies.mjs desktop
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare Developer ID and notarization credentials
        env:
          SUMMON_MACOS_P12_BASE64: ${{ secrets.SUMMON_MACOS_P12_BASE64 }}
          SUMMON_MACOS_P12_PASSWORD: ${{ secrets.SUMMON_MACOS_P12_PASSWORD }}
          SUMMON_ASC_PRIVATE_KEY: ${{ secrets.SUMMON_ASC_PRIVATE_KEY }}
          SUMMON_ASC_KEY_ID: ${{ secrets.SUMMON_ASC_KEY_ID }}
          SUMMON_ASC_ISSUER_ID: ${{ secrets.SUMMON_ASC_ISSUER_ID }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os, pathlib
          names = ['SUMMON_MACOS_P12_BASE64', 'SUMMON_MACOS_P12_PASSWORD', 'SUMMON_ASC_PRIVATE_KEY',
                   'SUMMON_ASC_KEY_ID', 'SUMMON_ASC_ISSUER_ID']
          missing = [name for name in names if not os.environ.get(name)]
          if missing: raise SystemExit('Missing macOS signing configuration: ' + ', '.join(missing))
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'summon-macos-signing'
          root.mkdir(mode=0o700)
          root.joinpath('distribution.p12').write_bytes(base64.b64decode(os.environ['SUMMON_MACOS_P12_BASE64'], validate=True))
          root.joinpath('AuthKey.p8').write_text(os.environ['SUMMON_ASC_PRIVATE_KEY'])
          PY
      - name: Build, sign, and notarize Apple Silicon DMG and ZIP
        run: |
          if [[ "$CANDIDATE" == true ]]; then
            npm run release:desktop -- --candidate --arch arm64
          else
            npm run release:desktop -- --github --arch arm64
          fi
        env:
          CANDIDATE: ${{ inputs.candidate }}
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ runner.temp }}/summon-macos-signing/distribution.p12
          CSC_KEY_PASSWORD: ${{ secrets.SUMMON_MACOS_P12_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/summon-macos-signing/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.SUMMON_ASC_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.SUMMON_ASC_ISSUER_ID }}
      - uses: actions/upload-artifact@v4
        if: inputs.candidate
        with:
          name: summon-candidate-macos-arm64
          path: |
            .relay/client-builds/macos-arm64/*.dmg
            .relay/client-builds/macos-arm64/artifact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove macOS signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/summon-macos-signing"

  android:
    if: github.event_name == 'push' || inputs.platform == 'cloud' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/summon-ci-dependencies
          key: summon-client-deps-v1-gradle-8.11.1
      - name: Prepare official Gradle distribution through GitHub asset API
        run: node scripts/release/prepare-ci-dependencies.mjs android
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare existing Android signing identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SUMMON_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::Configure SUMMON_ANDROID_KEYSTORE_BASE64 and the existing Android signing credentials.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/summon-android.p12"
      - name: Build signed APK
        run: |
          if [[ "$CANDIDATE" == true ]]; then
            npm run release:android
          else
            npm run release:android -- --github
          fi
        env:
          CANDIDATE: ${{ inputs.candidate }}
          GH_TOKEN: ${{ github.token }}
          SUMMON_ANDROID_KEYSTORE: ${{ runner.temp }}/summon-android.p12
          SUMMON_ANDROID_KEY_ALIAS: ${{ secrets.SUMMON_ANDROID_KEY_ALIAS }}
          SUMMON_ANDROID_STORE_PASSWORD: ${{ secrets.SUMMON_ANDROID_STORE_PASSWORD }}
          SUMMON_ANDROID_KEY_PASSWORD: ${{ secrets.SUMMON_ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: inputs.candidate
        with:
          name: summon-candidate-android
          path: |
            .relay/client-builds/android-universal/*.apk
            .relay/client-builds/android-universal/artifact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    if: github.event_name == 'push' || inputs.platform == 'cloud' || inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix desktop --no-audit --no-fund
      - run: npm ci --omit=dev --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: summon-client-deps-v1-windows-x64-electron-45.2.1-builder-26.18.1
      - name: Prepare official desktop dependencies through GitHub asset API
        run: node scripts/release/prepare-ci-dependencies.mjs desktop
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build Windows x64
        run: |
          if ($env:CANDIDATE -eq 'true') {
            npm run release:desktop -- --arch x64 --candidate
          } else {
            npm run release:desktop -- --arch x64 --github
          }
        env:
          CANDIDATE: ${{ inputs.candidate }}
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: inputs.candidate
        with:
          name: summon-candidate-windows-x64
          path: |
            .relay/client-builds/windows-x64/*.exe
            .relay/client-builds/windows-x64/artifact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  ios-simulator:
    if: inputs.candidate && inputs.platform == 'cloud'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator app
        run: |
          xcodebuild -project ios/Summon.xcodeproj -scheme SummonBot -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/summon-ios" CODE_SIGNING_ALLOWED=NO build -quiet
          ditto -c -k --keepParent "$RUNNER_TEMP/summon-ios/Build/Products/Release-iphonesimulator/Summon Bot.app" "$RUNNER_TEMP/summon-ios-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: summon-candidate-ios-simulator
          path: ${{ runner.temp }}/summon-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
